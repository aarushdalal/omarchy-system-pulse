<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#262b3a" stroke-width="2"/>
  <circle cx="64" cy="64" r="44" fill="url(#halo)"/>

  <!-- Hexagonal Boundary / Telemetry Node -->
  <polygon points="64,28 95,46 95,82 64,100 33,82 33,46" fill="none" stroke="#373f54" stroke-width="2" stroke-linejoin="round"/>

  <!-- Telemetry Grid Bars -->
  <line x1="64" y1="36" x2="64" y2="44" stroke="#525d7a" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="84" x2="64" y2="92" stroke="#525d7a" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic ECG / System Pulse Waveform -->
  <path d="M24 64h22l6-18 8 36 8-26 5 12 5-4h26" fill="none" stroke="url(#pulseGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Telemetry Nodes -->
  <circle cx="52" cy="46" r="3.5" fill="#FFA07A"/>
  <circle cx="60" cy="82" r="3.5" fill="#FF3366"/>
  <circle cx="68" cy="56" r="3.5" fill="#FFA07A"/>
</svg>